[project]
name = "h3n2-radicality"
version = "0.1.0"
description = "Analysis utilities for amino-acid substitution radicality in H3N2 hemagglutinin"
requires-python = ">=3.10"
dependencies = [
  "aaindex>=1.1.2",
  "biopython>=1.84",
  "ete3>=3.1.3",
  "pandas>=2.2",
]

[project.optional-dependencies]
notebooks = [
  "jupyterlab>=4.2",
  "numpy>=2.0",
]
test = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
